name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    runs-on: ubuntu-latest
    needs: [image]
    steps:
      - uses: actions/checkout@v4
      - name: 安装 podman 并配置 rootless 环境
        run: |
          sudo apt-get update
          sudo apt-get install -y podman slirp4netns
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          podman --version
      - name: main 镜像重跑冒烟（same-tree：merge 后验收同一 tree 内容）
        env:
          REPO: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          JMAPI_SMOKE_MATRIX: full
        run: |
          case "$GITHUB_SHA" in ''|*[!0-9a-f]*) echo "invalid GITHUB_SHA"; exit 1;; esac
          bash scripts/acceptance/smoke.sh "ghcr.io/${REPO}:sha-${GITHUB_SHA::7}"